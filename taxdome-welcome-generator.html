  .photo-upload-icon { font-size: 28px; margin-bottom: 6px; }

  .theme-btn {
    flex: 1; padding: 10px 0; border-radius: 10px; border: 2px solid #e2e5ef;

  .theme-btn:hover { border-color: #3d5af1; }
  .divider { border: none; border-top: 1px solid #edf0f7; margin: 24px 0; }
  .btn-download {

let state = {
  name: 'Sebastian Gomez Nohava',
  role: 'Sales Development Support',
  country: 'Colombia',
  theme: 'light',
  photo: null
};

function setTheme(t) {
  state.theme = t;
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.theme === t);
  });
  render();
}

function pill(ctx, x, y, w, h) {
  const r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arc(x + w - r, y + r, r, -Math.PI/2, Math.PI/2);
  ctx.lineTo(x + r, y + h);
  ctx.arc(x + r, y + r, r, Math.PI/2, -Math.PI/2);
  ctx.closePath();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function render() {
  const dark = state.theme === 'dark';

  // Background image
  const bg = dark ? bgDark : bgLight;
  const bgReady = dark ? bgDarkReady : bgLightReady;
  if (bgReady) {
    const scale = Math.max(W / bg.width, H / bg.height);
    const dw = bg.width * scale, dh = bg.height * scale;
    const dx = (W - dw) / 2, dy = (H - dh) / 2;
    ctx.drawImage(bg, dx, dy, dw, dh);
  } else {
    // Fallback gradient while loading
    const grd = dark
      ? ctx.createLinearGradient(0, 0, W, H)
      : ctx.createLinearGradient(0, 0, W * 0.7, H);
    if (dark) { grd.addColorStop(0, '#2b47e8'); grd.addColorStop(1, '#3d5af1'); }
    else       { grd.addColorStop(0, '#e8edff'); grd.addColorStop(1, '#f5f7ff'); }
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
  }

  const padX = 56, padY = 52;

  // ── Welcome badge (filled pill) ──
  const badgeText = 'Welcome to TaxDome';
  ctx.font = '500 22px SuisseIntl, sans-serif';
  const badgeTextW = ctx.measureText(badgeText).width;
  const badgeH = 48;
  const badgeW = badgeTextW + 52;

  ctx.fillStyle = dark ? '#1e35c7' : '#f5c842';
  pill(ctx, padX, padY, badgeW, badgeH);
  ctx.fill();

  ctx.fillStyle = dark ? '#fff' : '#1a1d2e';
  ctx.font = '500 22px SuisseIntl, sans-serif';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'center';
  const badgeM = ctx.measureText(badgeText);
  const badgeTH = badgeM.actualBoundingBoxAscent + badgeM.actualBoundingBoxDescent;
  ctx.fillText(badgeText, padX + badgeW / 2, padY + (badgeH + badgeTH) / 2 - badgeM.actualBoundingBoxDescent);
  ctx.textAlign = 'left';

  // ── Location badge (outline pill) ──
  const locY = padY + badgeH + 16;
  const locText = state.country || 'Country';
  ctx.font = '500 22px SuisseIntl, sans-serif';
  const locTextW = ctx.measureText(locText).width;
  const locH = 48;
  const iconSlot = 28;
  const locW = locTextW + iconSlot + 44;

  ctx.strokeStyle = dark ? 'rgba(255,255,255,0.35)' : '#3d5af1';
  ctx.lineWidth = 2;
  pill(ctx, padX, locY, locW, locH);
  ctx.stroke();

  // pin icon — vertically centered
  ctx.font = '18px sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = dark ? '#fff' : '#3d5af1';
  ctx.fillText('📍', padX + 14, locY + locH / 2);

  // location text — precise vertical centering
  ctx.fillStyle = dark ? '#fff' : '#1a1d2e';
  ctx.font = '500 22px SuisseIntl, sans-serif';
  ctx.textBaseline = 'alphabetic';
  const locM = ctx.measureText(locText);
  const locTH = locM.actualBoundingBoxAscent + locM.actualBoundingBoxDescent;
  ctx.fillText(locText, padX + 14 + iconSlot, locY + (locH + locTH) / 2 - locM.actualBoundingBoxDescent);

  // ── Name + Role ──
  const nameY = H - 118;
  ctx.fillStyle = dark ? '#fff' : '#1a1d2e';
  ctx.font = 'bold 46px SuisseIntl, sans-serif';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(state.name || 'Имя Фамилия', padX, nameY);

  ctx.fillStyle = dark ? 'rgba(160,185,255,0.9)' : '#3d5af1';
  ctx.font = 'bold 34px SuisseIntl, sans-serif';
  ctx.fillText(state.role || 'Должность', padX, nameY + 52);

  // ── Photo area ──
  const photoX = W - 320 - 48;
  const photoY = 40;
  const photoW = 320;
  const photoH = H - 80;

  ctx.shadowColor = 'rgba(0,0,0,0.18)';
  ctx.shadowBlur = 24;
  ctx.shadowOffsetY = 8;
  roundRect(ctx, photoX, photoY, photoW, photoH, 24);
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  if (state.photo) {
    ctx.save();
    roundRect(ctx, photoX, photoY, photoW, photoH, 24);
    ctx.clip();
    const img = state.photo;
    const scale = Math.max(photoW / img.width, photoH / img.height);
    const dw = img.width * scale, dh = img.height * scale;
    const dx = photoX + (photoW - dw) / 2;
    const dy = photoY + (photoH - dh) / 2;
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.restore();
  } else {
    const sq = 24;
    ctx.save();
    roundRect(ctx, photoX, photoY, photoW, photoH, 24);
    ctx.clip();
    for (let row = 0; row * sq < photoH; row++) {
      for (let col = 0; col * sq < photoW; col++) {
        ctx.fillStyle = (row + col) % 2 === 0
          ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.06)';
        ctx.fillRect(photoX + col * sq, photoY + row * sq, sq, sq);
      }
    }
    ctx.restore();
    ctx.fillStyle = dark ? 'rgba(255,255,255,0.4)' : 'rgba(60,80,200,0.3)';
    ctx.font = '18px SuisseIntl, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.fillText('Фото сотрудника', photoX + photoW / 2, photoY + photoH / 2);
    ctx.textAlign = 'left';
  }
}

['name','role','country'].forEach(id => {
  document.getElementById(`inp-${id}`).addEventListener('input', function() {
    state[id] = this.value; render();
  });
});

document.getElementById('photo-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    state.photo = img;
    const prev = document.getElementById('photo-preview');
    prev.src = url; prev.style.display = 'block';
    document.getElementById('upload-placeholder').style.display = 'none';
    render();
  };
  img.src = url;
});

function downloadCard() {
  const link = document.createElement('a');
  const name = (state.name || 'employee').replace(/\s+/g, '_');
  link.download = `welcome_${name}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

document.fonts.ready.then(() => render());
</script>
