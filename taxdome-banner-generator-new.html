.layout{display:grid;grid-template-columns:360px 1fr;gap:32px;max-width:1200px;margin:0 auto;align-items:start}
.form-panel{background:#fff;border-radius:16px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.section-title{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#9399a8;margin-bottom:14px;margin-top:20px}
.section-title:first-child{margin-top:0}
.field{margin-bottom:14px}
label{display:block;font-size:13px;font-weight:500;color:#3d4155;margin-bottom:5px}
input[type="text"]{width:100%;padding:9px 13px;border:1.5px solid #e2e5ef;border-radius:9px;font-family:'SuisseIntl',sans-serif;font-size:14px;color:#1a1d2e;background:#fafbfc;outline:none;transition:border-color .2s}
input[type="text"]:focus{border-color:#3d5af1;background:#fff}
.divider{border:none;border-top:1px solid #edf0f7;margin:18px 0}
.btn-download{width:100%;padding:13px;background:#3d5af1;color:#fff;border:none;border-radius:11px;font-family:'SuisseIntl',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s;margin-top:6px}
.btn-download:hover{background:#2d47d4}
.preview-panel{display:flex;flex-direction:column}
.preview-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#9399a8;margin-bottom:10px}
#card-wrapper{border-radius:12px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.14);width:100%}
canvas{display:block;width:100%;height:auto}
.hint{font-size:12px;color:#9399a8;text-align:center;margin-top:6px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.toggle-row label{margin:0;font-size:13px;font-weight:500;color:#3d4155}
.toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#d0d4e4;border-radius:11px;cursor:pointer;transition:.2s}
.toggle-slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked + .toggle-slider{background:#3d5af1}
.toggle input:checked + .toggle-slider:before{transform:translateX(18px)}
.bg-picker{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.bg-option{width:80px;height:30px;border-radius:8px;cursor:pointer;border:2.5px solid transparent;overflow:hidden;transition:border-color .2s;flex-shrink:0}
.bg-option.active{border-color:#3d5af1}
.bg-option img{width:100%;height:100%;object-fit:cover;display:block}
</style>
</head>
<body>
<div style="max-width:1200px;margin:0 auto">
  <h1>Banner Generator</h1>
  <p class="subtitle">Horizontal banners for Google Forms, Confluence and more · 3200×800 px</p>
  <div class="layout">
    <div class="form-panel">
      <p class="section-title">Background</p>
      <div class="bg-picker" id="bg-picker"></div>
      <hr class="divider">
      <p class="section-title">Tags (top left)</p>
      <div class="toggle-row">
        <label>Blue tag (category)</label>
        <label class="toggle"><input type="checkbox" id="tog-blue" checked onchange="render()"><span class="toggle-slider"></span></label>
      </div>
      <div class="field" id="field-blue">
        <input type="text" id="inp-blue" value="Sales Talks" oninput="render()">
      </div>
      <div class="toggle-row">
        <label>Yellow tag (episode / label)</label>
        <label class="toggle"><input type="checkbox" id="tog-yellow" checked onchange="render()"><span class="toggle-slider"></span></label>
      </div>
      <div class="field" id="field-yellow">
        <input type="text" id="inp-yellow" value="Episode 1" oninput="render()">
      </div>
      <hr class="divider">
      <p class="section-title">Title</p>
      <div class="field">
        <input type="text" id="inp-title1" value="Monthly " placeholder="Part 1" oninput="render()">
      </div>
      <div class="field">
        <input type="text" id="inp-title2" value="All Hands Syncs Launch" placeholder="Part 2" oninput="render()">
      </div>
      <hr class="divider">
      <button class="btn-download" onclick="downloadCard()">⬇ Download PNG</button>
    </div>
    <div class="preview-panel">
      <p class="preview-label">Preview</p>
      <div id="card-wrapper">
        <canvas id="card" width="3200" height="800"></canvas>
      </div>
      <p class="hint">3200 × 800 px · updates automatically</p>
    </div>
  </div>
</div>

const picker = document.getElementById('bg-picker');
BG_DATA.forEach(bg => {
  const div = document.createElement('div');
  div.className = 'bg-option' + (bg.id === activeBg ? ' active' : '');
  div.dataset.id = bg.id;
  const img = document.createElement('img');
  img.src = bg.src;
  div.appendChild(img);
  div.onclick = () => {
    activeBg = bg.id;
    document.querySelectorAll('.bg-option').forEach(d => d.classList.toggle('active', d.dataset.id === bg.id));
    render();
  };
  picker.appendChild(div);
});

['blue','yellow'].forEach(c => {
  document.getElementById('tog-'+c).addEventListener('change', function() {
    document.getElementById('field-'+c).style.opacity = this.checked ? '1' : '0.35';
  });
});

function pill(x, y, w, h) {
  const r = h/2;
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.arc(x+w-r,y+r,r,-Math.PI/2,Math.PI/2);
  ctx.lineTo(x+r,y+h);
  ctx.arc(x+r,y+r,r,Math.PI/2,-Math.PI/2);
  ctx.closePath();
}

function render() {
  const blueOn    = document.getElementById('tog-blue').checked;
  const yellowOn  = document.getElementById('tog-yellow').checked;
  const blueText  = document.getElementById('inp-blue').value;
  const yellowText= document.getElementById('inp-yellow').value;
  const title1    = document.getElementById('inp-title1').value;
  const title2    = document.getElementById('inp-title2').value;

  const bg = bgImgs[activeBg];
  if (bg) {
    const scale = Math.max(W/bg.width, H/bg.height);
    const dw = bg.width*scale, dh = bg.height*scale;
    ctx.drawImage(bg, (W-dw)/2, (H-dh)/2, dw, dh);
  } else {
    ctx.fillStyle='#3050f0'; ctx.fillRect(0,0,W,H);
  }

  const padX=88, padY=80, tagH=96;
  const tagFont='600 52px SuisseIntl, sans-serif';
  const tagPadX=52, tagGap=24;
  const tagCY = padY + tagH/2 + 6;

  function drawTag(text, x, fillColor, textColor) {
    ctx.font = tagFont;
    const tw = ctx.measureText(text).width;
    const tagW = tw + tagPadX*2;
    ctx.fillStyle = fillColor;
    pill(x, padY, tagW, tagH); ctx.fill();
    ctx.fillStyle = textColor;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText(text, x+tagPadX, tagCY);
    return tagW;
  }

  let tagX = padX;
  if (blueOn && blueText)    { tagX += drawTag(blueText, tagX, '#4060ee', '#ffffff') + tagGap; }
  if (yellowOn && yellowText) { drawTag(yellowText, tagX, '#f5c842', '#1a1d2e'); }

  if (logoReady) {
    const lh = tagH*2.0, lw = Math.round(lh*(384/432));
    ctx.drawImage(logoImg, W-padY-lw, padY, lw, lh);
  }

  const safeBottom=80, bottomY=H-safeBottom;
  const titleFont='600 174px SuisseIntl, sans-serif';
  const fullText = title1+title2;
  ctx.font=titleFont; ctx.fillStyle='#fff'; ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  const mFull = ctx.measureText(fullText);
  if (mFull.width <= W-padX*2) {
    ctx.fillText(fullText, padX, bottomY-mFull.actualBoundingBoxDescent);
  } else {
    const mT1=ctx.measureText(title1), mT2=ctx.measureText(title2);
    const y2=bottomY-mT2.actualBoundingBoxDescent;
    const y1=y2-mT2.actualBoundingBoxAscent-24-mT1.actualBoundingBoxDescent;
    ctx.fillText(title1, padX, y1);
    ctx.fillText(title2, padX, y2);
  }
}

['inp-blue','inp-yellow','inp-title1','inp-title2'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
});

function downloadCard() {
  const link = document.createElement('a');
  const t = (document.getElementById('inp-title1').value+document.getElementById('inp-title2').value).trim().replace(/\s+/g,'_').slice(0,40);
  link.download = 'banner_'+(t||'taxdome')+'.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

document.fonts.ready.then(() => { render(); render(); });
