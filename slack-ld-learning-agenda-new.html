.field-row{display:grid;grid-template-columns:1fr;gap:14px}
label{display:block;font-size:11px;font-weight:600;color:#67768B;margin-bottom:5px;letter-spacing:.04em;text-transform:uppercase}
input[type=text]{width:100%;padding:9px 12px;border:1.5px solid #E2E8F0;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;color:#202020;background:#F8FAFC;outline:none;transition:border-color .15s}
input[type=text]:focus{border-color:#FFD700;background:#fff}
.field-hint{font-size:11px;color:#9CA3AF;margin-top:3px}

.preview-wrap{margin-bottom:16px}
.preview-label{font-size:11px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.canvas-wrap{border-radius:8px;overflow:hidden;box-shadow:0 4px 20px rgba(15,26,42,.10)}
canvas{display:block;width:100%;height:auto}

.btn-dl{display:inline-flex;align-items:center;gap:7px;background:#2851F5;color:#fff;border:none;padding:10px 22px;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-dl:hover{background:#1A3DBF}
.btn-note{font-size:11px;color:#9CA3AF;margin-top:6px}
</style>

function getImg(key, src, cb) {
  if (imgCache[key]) { cb(imgCache[key]); return; }
  const img = new Image();
  img.onload = () => { imgCache[key] = img; cb(img); };
  img.src = src;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function selectSlogan(key) {
  currentSlogan = key;
  document.querySelectorAll('.slogan-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('customField').style.display = (key === 'custom') ? 'block' : 'none';
  render();
}

const EXPORT_SCALE = 2;
const LOGICAL_W = 1261, LOGICAL_H = 231;

function render() {
  const canvas = document.getElementById('canvas');
  if (!canvas.dataset.hires) {
    canvas.width = LOGICAL_W * EXPORT_SCALE;
    canvas.height = LOGICAL_H * EXPORT_SCALE;
    canvas.dataset.hires = '1';
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(EXPORT_SCALE, 0, 0, EXPORT_SCALE, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  
  const cfg = CONFIG[currentSlogan];
  if (currentSlogan === 'custom') {
    cfg.slogan = document.getElementById('customTag').value || 'Custom Tag';
  }
  const title = document.getElementById('title').value;

  // BACKGROUND FIRST — draw the real uploaded image, cover-fit
  getImg('bg', BG_SRC, (bg) => {
    const cw = LOGICAL_W, ch = LOGICAL_H;
    const ir = bg.width / bg.height, cr = cw / ch;
    let dw, dh, dx, dy;
    if (ir > cr) { dh = ch; dw = ch * ir; dx = (cw - dw) / 2; dy = 0; }
    else { dw = cw; dh = cw / ir; dx = 0; dy = (ch - dh) / 2; }
    ctx.drawImage(bg, dx, dy, dw, dh);
    drawContent(ctx, cfg, title);
  });
}

function drawContent(ctx, cfg, title) {
  const canvas = document.getElementById('canvas');

  // Slogan tag (top-left) — perfect rounded pill
  const sloganFs = 21;
  ctx.font = `600 ${sloganFs}px Inter, sans-serif`;
  const sloganTw = ctx.measureText(cfg.slogan).width;
  const sloganPad = 18;
  const sloganPh = 46;
  const sloganPw = sloganTw + sloganPad * 2;
  const sloganX = 28, sloganY = 25;
  const pillRadius = sloganPh / 2;
  
  // Draw rounded pill background
  ctx.save();
  ctx.fillStyle = cfg.tagBg;
  ctx.beginPath();
  ctx.moveTo(sloganX + pillRadius, sloganY);
  ctx.lineTo(sloganX + sloganPw - pillRadius, sloganY);
  ctx.arcTo(sloganX + sloganPw, sloganY, sloganX + sloganPw, sloganY + pillRadius, pillRadius);
  ctx.lineTo(sloganX + sloganPw, sloganY + sloganPh - pillRadius);
  ctx.arcTo(sloganX + sloganPw, sloganY + sloganPh, sloganX + sloganPw - pillRadius, sloganY + sloganPh, pillRadius);
  ctx.lineTo(sloganX + pillRadius, sloganY + sloganPh);
  ctx.arcTo(sloganX, sloganY + sloganPh, sloganX, sloganY + sloganPh - pillRadius, pillRadius);
  ctx.lineTo(sloganX, sloganY + pillRadius);
  ctx.arcTo(sloganX, sloganY, sloganX + pillRadius, sloganY, pillRadius);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Pill text
  ctx.fillStyle = cfg.tagColor;
  ctx.font = `600 ${sloganFs}px Inter, sans-serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(cfg.slogan, sloganX + sloganPad, sloganY + sloganPh / 2);

  // Logo (top-right) — 2x BIGGER with equal padding
  getImg('logo', LOGO_SRC, function(logo) {
    const logoW = 140;
    const logoH = 40;
    const logoPad = 28;
    ctx.drawImage(logo, LOGICAL_W - logoW - logoPad, logoPad, logoW, logoH);
    
    // Title (bottom) — MUCH LARGER and centered-left
    const titleFs = 58;
    ctx.font = `700 ${titleFs}px Inter, sans-serif`;
    ctx.fillStyle = cfg.textColor;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText(title, 28, LOGICAL_H - 28);
  });
}

function download() {
  const canvas = document.getElementById('canvas');
  const link = document.createElement('a');
  link.href = canvas.toDataURL('image/png');
  link.download = `learning-agenda-banner-${CONFIG[currentSlogan].slogan.replace(/\s/g, '-').toLowerCase()}.png`;
  link.click();
}

render();
if (document.fonts && document.fonts.ready) {
  Promise.all([
    document.fonts.load('400 21px Inter'),
    document.fonts.load('600 21px Inter'),
    document.fonts.load('700 32px Inter')
  ]).then(() => document.fonts.ready).then(() => render()).catch(() => {});
}
</script>
</body>
</html>
