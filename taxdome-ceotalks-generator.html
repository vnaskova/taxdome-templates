.subtitle { font-size: 14px; color: #6b7080; margin-bottom: 28px; }
.layout { display: grid; grid-template-columns: 380px 1fr; gap: 32px; max-width: 1100px; margin: 0 auto; align-items: start; }
.form-panel { background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.section-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #9399a8; margin-bottom: 14px; margin-top: 20px; }
.section-title:first-child { margin-top: 0; }
.field { margin-bottom: 14px; }
label { display: block; font-size: 13px; font-weight: 500; color: #3d4155; margin-bottom: 5px; }
input[type="text"] { width: 100%; padding: 9px 13px; border: 1.5px solid #e2e5ef; border-radius: 9px; font-family: 'SuisseIntl', sans-serif; font-size: 14px; color: #1a1d2e; background: #fafbfc; outline: none; transition: border-color .2s; }
input[type="text"]:focus { border-color: #3d5af1; background: #fff; }
.photo-upload { border: 2px dashed #d0d4e4; border-radius: 10px; padding: 14px; text-align: center; cursor: pointer; background: #f8f9fd; transition: all .2s; position: relative; }
.photo-upload:hover { border-color: #3d5af1; background: #f0f3ff; }
.photo-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.photo-upload p { font-size: 12px; color: #6b7080; }
.photo-upload p strong { color: #3d5af1; }
.person-block { border: 1px solid #edf0f7; border-radius: 12px; padding: 16px; margin-bottom: 14px; background: #fafbfc; }
.person-block h4 { font-size: 13px; font-weight: 600; color: #3d4155; margin-bottom: 12px; }
.remove-btn { background: none; border: 1px solid #e2e5ef; border-radius: 7px; font-family: 'SuisseIntl', sans-serif; font-size: 12px; color: #9399a8; cursor: pointer; padding: 4px 10px; float: right; margin-top: -2px; }
.remove-btn:hover { border-color: #f44; color: #f44; }
.add-person-btn { width: 100%; padding: 10px; border: 2px dashed #d0d4e4; border-radius: 10px; background: none; font-family: 'SuisseIntl', sans-serif; font-size: 13px; font-weight: 500; color: #6b7080; cursor: pointer; transition: all .2s; margin-bottom: 14px; }
.add-person-btn:hover { border-color: #3d5af1; color: #3d5af1; background: #f0f3ff; }
.add-person-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.divider { border: none; border-top: 1px solid #edf0f7; margin: 18px 0; }
.btn-download { width: 100%; padding: 13px; background: #3d5af1; color: #fff; border: none; border-radius: 11px; font-family: 'SuisseIntl', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .2s; margin-top: 6px; }
.btn-download:hover { background: #2d47d4; }
.preview-panel { display: flex; flex-direction: column; }
.preview-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #9399a8; margin-bottom: 10px; }
#card-wrapper { border-radius: 16px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.14); display: inline-block; width: 100%; }
canvas { display: block; width: 100%; height: auto; }
.hint { font-size: 12px; color: #9399a8; text-align: center; margin-top: 6px; }
</style>

function pill(x, y, w, h) {
  const r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arc(x + w - r, y + r, r, -Math.PI/2, Math.PI/2);
  ctx.lineTo(x + r, y + h);
  ctx.arc(x + r, y + r, r, Math.PI/2, -Math.PI/2);
  ctx.closePath();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// Precise vertical centering using actual bounding box
function fillTextVC(text, x, cy, font, align='left') {
  ctx.font = font;
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = align;
  const m = ctx.measureText(text);
  const th = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  ctx.fillText(text, x, cy + m.actualBoundingBoxAscent - th / 2);
}

function drawPhoto(img, x, y, w, h, r) {
  ctx.save();
  roundRect(x, y, w, h, r); ctx.clip();
  const scale = Math.max(w/img.width, h/img.height);
  const dw = img.width*scale, dh = img.height*scale;
  ctx.drawImage(img, x+(w-dw)/2, y+(h-dh)/2, dw, dh);
  ctx.restore();
}

function drawNameTag(name, role, x, y) {
  const nameFont = '600 26px SuisseIntl, sans-serif';
  const roleFont = '400 22px SuisseIntl, sans-serif';
  const padX = 16, padY = 12, gap = 6;
  ctx.font = nameFont;
  const nW = ctx.measureText(name).width;
  ctx.font = roleFont;
  const rW = ctx.measureText(role).width;
  const boxW = Math.max(nW, rW) + padX * 2;
  const nameM = (() => { ctx.font = nameFont; return ctx.measureText(name); })();
  const roleM = (() => { ctx.font = roleFont; return ctx.measureText(role); })();
  const nH = nameM.actualBoundingBoxAscent + nameM.actualBoundingBoxDescent;
  const rH = roleM.actualBoundingBoxAscent + roleM.actualBoundingBoxDescent;
  const boxH = padY + nH + gap + rH + padY;

  ctx.fillStyle = '#fff';
  roundRect(x, y, boxW, boxH, 10); ctx.fill();

  ctx.fillStyle = '#1a1d2e';
  ctx.font = nameFont; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.fillText(name, x + padX, y + padY + nameM.actualBoundingBoxAscent);

  ctx.fillStyle = '#6b7080';
  ctx.font = roleFont;
  ctx.fillText(role, x + padX, y + padY + nH + gap + roleM.actualBoundingBoxAscent);
}

function render() {
  const tag    = document.getElementById('inp-tag').value    || 'CEO Talks';
  const title1 = document.getElementById('inp-title1').value || '';
  const title2 = document.getElementById('inp-title2').value || '';
  const dateStr= document.getElementById('inp-date').value   || '';
  const count  = persons.length;
  const padX   = 60;

  // ── Background ──
  if (bgReady) {
    const scale = Math.max(W/bgImg.width, H/bgImg.height);
    const dw = bgImg.width*scale, dh = bgImg.height*scale;
    ctx.drawImage(bgImg, (W-dw)/2, (H-dh)/2, dw, dh);
  } else {
    ctx.fillStyle = '#3050f0'; ctx.fillRect(0,0,W,H);
  }

  // ── Tag pill ──
  ctx.font = '500 24px SuisseIntl, sans-serif';
  const tagTW = ctx.measureText(tag).width;
  const tagH = 48, tagW = tagTW + 52;
  ctx.fillStyle = '#2c3fc7';
  pill(padX, 62, tagW, tagH); ctx.fill();
  ctx.fillStyle = '#fff';
  fillTextVC(tag, padX + tagW/2, 62 + tagH/2, '500 24px SuisseIntl, sans-serif', 'center');

  // ── TD Logo (real image, top right) ──
  if (logoReady) {
    const logoH = 96;
    const logoW = Math.round(logoH * (1002 / 1128));
    ctx.drawImage(logoImg, W - padX - logoW, 38, logoW, logoH);
  }

  // ── Title (semibold) ──
  const titleSize = 108;
  const titleFont1 = `600 ${titleSize}px SuisseIntl, sans-serif`;
  const titleFont2 = `600 ${titleSize}px SuisseIntl, sans-serif`;
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';

  const titleY = 260;
  const lineGap = titleSize * 1.08;

  if (title1) {
    ctx.fillStyle = '#fff';
    ctx.font = titleFont1;
    ctx.fillText(title1, padX, titleY);
  }
  if (title2) {
    ctx.fillStyle = '#ffffff';
    ctx.font = titleFont2;
    ctx.fillText(title2, padX, titleY + lineGap);
  }

  // ── Date ──
  const dateY = (title1 && title2) ? titleY + lineGap + 46
              : title1             ? titleY + 50
              : 320;
  if (dateStr) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '400 28px SuisseIntl, sans-serif';
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    ctx.fillText(dateStr, padX, dateY + 20);
  }

  // ── Photos area ──
  // Fixed photo area: start after date, leave 50px at bottom
  const photoTop  = dateY + (dateStr ? 70 : 20);
  const photoBot  = H - 50;
  const photoAreaH = photoBot - photoTop;

  // Card proportions — closer to original (4:5 ratio)
  const nameTagH = 86; // approximate name tag height
  const cardH = Math.round(photoAreaH * 0.72); // photo only, not counting nametag
  const nameTagGap = 14;

  if (count === 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    roundRect(padX, photoTop, W-padX*2, photoAreaH-20, 20); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = '400 22px SuisseIntl, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Добавь участников', W/2, photoTop + (photoAreaH-20)/2);
    ctx.textAlign = 'left';

  } else if (count === 1) {
    // Full-bleed cutout bottom-right, fading left
    const p = persons[0];
    const photoW = Math.round(W * 0.56);
    const ph = photoBot - photoTop;
    const photoX = W - photoW;
    if (p.img) {
      drawPhoto(p.img, photoX, photoTop, photoW, ph, 0);
      // left fade
      const fade = ctx.createLinearGradient(photoX, 0, photoX + 200, 0);
      fade.addColorStop(0, 'rgba(42,58,220,1)');
      fade.addColorStop(1, 'rgba(42,58,220,0)');
      ctx.fillStyle = fade;
      ctx.fillRect(photoX, photoTop, 200, ph);
    }
    // bottom fade so it bleeds into edge
    const btmFade = ctx.createLinearGradient(0, photoBot - 80, 0, photoBot);
    btmFade.addColorStop(0, 'rgba(42,58,220,0)');
    btmFade.addColorStop(1, 'rgba(42,58,220,0.5)');
    ctx.fillStyle = btmFade;
    ctx.fillRect(photoX, photoBot - 80, photoW, 80);

    // Name tag bottom left
    drawNameTag(p.name||'Имя', p.role||'Должность', padX, photoBot - nameTagH - 10);

  } else if (count === 2) {
    const gap = 24;
    const cardW = Math.floor((W - padX*2 - gap) / 2);
    for (let i = 0; i < 2; i++) {
      const p = persons[i];
      const cx = padX + i*(cardW+gap);
      const cy = photoTop;
      ctx.fillStyle = 'rgba(100,130,255,0.18)';
      roundRect(cx, cy, cardW, cardH, 18); ctx.fill();
      if (p.img) drawPhoto(p.img, cx, cy, cardW, cardH, 18);
      drawNameTag(p.name||'Имя', p.role||'Должность', cx, cy + cardH + nameTagGap);
    }

  } else {
    const gap = 18;
    const cardW = Math.floor((W - padX*2 - gap*2) / 3);
    for (let i = 0; i < 3; i++) {
      const p = persons[i];
      const cx = padX + i*(cardW+gap);
      const cy = photoTop;
      ctx.fillStyle = 'rgba(100,130,255,0.18)';
      roundRect(cx, cy, cardW, cardH, 18); ctx.fill();
      if (p.img) drawPhoto(p.img, cx, cy, cardW, cardH, 18);
      drawNameTag(p.name||'Имя', p.role||'Должность', cx, cy + cardH + nameTagGap);
    }
  }
}

function addPerson() {
  if (persons.length >= 3) return;
  const id = ++personCounter;
  persons.push({ id, name:'', role:'', img:null });
  renderForms(); render();
}

function removePerson(id) {
  persons = persons.filter(p => p.id !== id);
  renderForms(); render();
}

function renderForms() {
  const c = document.getElementById('persons-container');
  c.innerHTML = '';
  const btn = document.getElementById('add-person-btn');
  btn.disabled = persons.length >= 3;
  btn.textContent = persons.length < 3 ? '+ Добавить участника' : '+ Добавить участника';

  persons.forEach((p, idx) => {
    const div = document.createElement('div');
    div.className = 'person-block';
    div.innerHTML = `
      <h4>Участник ${idx+1}
        <button class="remove-btn" onclick="removePerson(${p.id})">✕</button>
      </h4>
      <div class="field">
        <label>Имя и фамилия</label>
        <input type="text" value="${p.name}" placeholder="Имя Фамилия"
          oninput="updateP(${p.id},'name',this.value)">
      </div>
      <div class="field">
        <label>Должность</label>
        <input type="text" value="${p.role}" placeholder="CEO"
          oninput="updateP(${p.id},'role',this.value)">
      </div>
      <div class="field">
        <label>Фото</label>
        <div class="photo-upload">
          <input type="file" accept="image/*" onchange="uploadPhoto(${p.id},this)">
          <img id="prev-${p.id}" style="display:${p.img?'block':'none'};width:52px;height:52px;border-radius:8px;object-fit:cover;margin:0 auto 6px">
          <div id="status-${p.id}" style="display:none;font-size:12px;color:#3d5af1;margin-bottom:6px;font-family:SuisseIntl,sans-serif"></div>
          <p><strong>Загрузить фото</strong></p>
        </div>
      </div>`;
    c.appendChild(div);
  });
}

function updateP(id, field, val) {
  const p = persons.find(p=>p.id===id);
  if (p) { p[field]=val; render(); }
}

async function uploadPhoto(id, input) {
  const file = input.files[0]; if (!file) return;
  const p = persons.find(p => p.id === id);
  if (!p) return;

  const origUrl = URL.createObjectURL(file);
  const prev = document.getElementById(`prev-${id}`);
  const statusEl = document.getElementById(`status-${id}`);

  // Load original image first
  const origImg = await new Promise(res => {
    const img = new Image();
    img.onload = () => res(img);
    img.src = origUrl;
  });

  if (prev) { prev.src = origUrl; prev.style.display = 'block'; }

  if (persons.length !== 1) {
    p.img = origImg; render(); return;
  }

  // BG removal via MediaPipe SelfieSegmentation
  if (statusEl) { statusEl.textContent = '⏳ Убираю фон…'; statusEl.style.display = 'block'; }

  try {
    const seg = new SelfieSegmentation({locateFile: f =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`});
    seg.setOptions({ modelSelection: 1 });

    await new Promise((resolve, reject) => {
      seg.onResults(results => {
        try {
          const mask = results.segmentationMask;
          const w = origImg.naturalWidth, h = origImg.naturalHeight;

          // Draw original onto offscreen canvas
          const offscreen = document.createElement('canvas');
          offscreen.width = w; offscreen.height = h;
          const octx = offscreen.getContext('2d');
          octx.drawImage(origImg, 0, 0, w, h);
          const imgData = octx.getImageData(0, 0, w, h);

          // Draw mask onto mask canvas (mask is sized to input)
          const maskCanvas = document.createElement('canvas');
          maskCanvas.width = w; maskCanvas.height = h;
          const mctx = maskCanvas.getContext('2d');
          mctx.drawImage(mask, 0, 0, w, h);
          const maskData = mctx.getImageData(0, 0, w, h);

          // Apply mask as alpha
          for (let i = 0; i < maskData.data.length; i += 4) {
            imgData.data[i + 3] = maskData.data[i]; // red channel = person mask
          }
          octx.putImageData(imgData, 0, 0);

          offscreen.toBlob(blob => {
            const url = URL.createObjectURL(blob);
            const result = new Image();
            result.onload = () => {
              p.img = result;
              if (prev) prev.src = url;
              if (statusEl) {
                statusEl.textContent = '✅ Фон удалён';
                setTimeout(() => statusEl.style.display = 'none', 2500);
              }
              render();
              resolve();
            };
            result.src = url;
          }, 'image/png');
        } catch(e) { reject(e); }
      });

      // Send image to segmentation
      const sendCanvas = document.createElement('canvas');
      sendCanvas.width = origImg.naturalWidth;
      sendCanvas.height = origImg.naturalHeight;
      sendCanvas.getContext('2d').drawImage(origImg, 0, 0);
      seg.send({ image: sendCanvas }).catch(reject);
    });

  } catch(err) {
    console.error('Segmentation error:', err);
    if (statusEl) {
      statusEl.textContent = '⚠️ Не удалось убрать фон';
      setTimeout(() => statusEl.style.display = 'none', 3000);
    }
    p.img = origImg; render();
  }
}

['tag','title1','title2','date'].forEach(id => {
  document.getElementById(`inp-${id}`).addEventListener('input', render);
});

function downloadCard() {
  const link = document.createElement('a');
  const t = (document.getElementById('inp-title1').value||'card').replace(/\s+/g,'_');
  link.download = `ceotalks_${t}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

addPerson();
document.fonts.ready.then(() => render());
